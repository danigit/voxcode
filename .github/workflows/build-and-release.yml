name: Build and Package Cross-Platform VSIX

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-daemon:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            python-version: '3.11'
          - os: macos-latest
            target: darwin-arm64
            python-version: '3.11'
          - os: macos-15-intel
            target: darwin-x64
            python-version: '3.11'
          - os: ubuntu-latest
            target: linux-x64
            python-version: '3.11'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets faster-whisper sounddevice numpy pyinstaller

      - name: Freeze Daemon Executable
        run: |
          python server/build_headless.py --copy-to ./bin/${{ matrix.target }}

      - name: Upload Platform Binary
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: ./bin/${{ matrix.target }}
          retention-days: 7

  package-vsix:
    name: Package VSIX (${{ matrix.target }})
    needs: build-daemon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - darwin-arm64
          - darwin-x64
          - linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download Platform Daemon Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: ./bin/${{ matrix.target }}

      - name: Ensure Execution Permissions (Unix)
        if: matrix.target != 'win32-x64'
        run: |
          chmod +x ./bin/${{ matrix.target }}/voxcode-daemon || true

      - name: Download Whisper Base Model
        run: |
          mkdir -p models/base
          python3 -c "
          import urllib.request, os
          base_url = 'https://huggingface.co/Systran/faster-whisper-base/resolve/main/'
          files = ['config.json', 'model.bin', 'tokenizer.json', 'vocabulary.txt']
          for f in files:
              dest = os.path.join('models', 'base', f)
              if not os.path.exists(dest):
                  print(f'Downloading {f}...')
                  try:
                      urllib.request.urlretrieve(base_url + f, dest)
                  except Exception as e:
                      print(f'Mirroring {f}...')
                      urllib.request.urlretrieve('https://hf-mirror.com/Systran/faster-whisper-base/resolve/main/' + f, dest)
          "

      - name: Build TypeScript Extension
        run: npm run build:production

      - name: Package Target VSIX
        run: npx @vscode/vsce package --target ${{ matrix.target }} --no-dependencies --out voxcode-${{ matrix.target }}.vsix

      - name: Upload Target VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: voxcode-${{ matrix.target }}.vsix
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: voxcode-${{ matrix.target }}.vsix
